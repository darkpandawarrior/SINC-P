name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch cancels the first. Nothing here is worth paying for
# twice, and a queued run on stale code tells you nothing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sincp
          POSTGRES_PASSWORD: sincp
          POSTGRES_DB: sincp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sincp -d sincp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Migrations only. This role owns the schema and, because the postgres image
      # creates POSTGRES_USER as a superuser, it bypasses RLS unconditionally.
      DATABASE_MIGRATION_URL: postgres://sincp:sincp@localhost:5432/sincp
      SESSION_SECRET: ci-only-secret-not-used-for-anything-real
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm 10.x (bundled with Node 22) mis-serializes an optional peer dep vitest pulls
      # in, and `npm ci` then hard-fails reading that lockfile shape. Fixed in npm 12 —
      # see the matching note in the Dockerfile's deps stage.
      - run: npm install -g npm@12

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - name: Apply schema and row-level security policies
        run: |
          npx drizzle-kit push --force
          psql "$DATABASE_MIGRATION_URL" -v ON_ERROR_STOP=1 -f drizzle/0001_rls.sql

      # The tests must run as the same restricted role production uses.
      #
      # This job used to connect as the owner throughout, which quietly made every
      # tenant-isolation assertion vacuous: the postgres image creates POSTGRES_USER as a
      # SUPERUSER, and a superuser bypasses RLS whatever the policies say. The suite went
      # green because the application layer also filters by institutionId, so the second
      # line of defence was never actually under test in CI.
      #
      # drizzle/0001_rls.sql created sincp_app and sincp_admin above, so point the app at
      # them now that they exist.
      - name: Connect as the restricted runtime role
        run: |
          echo "DATABASE_URL=postgres://sincp_app:sincp_app_dev_only@localhost:5432/sincp" >> "$GITHUB_ENV"
          echo "DATABASE_ADMIN_URL=postgres://sincp_admin:sincp_admin_dev_only@localhost:5432/sincp" >> "$GITHUB_ENV"

      - name: Assert RLS is actually on
        run: npm run db:check-rls

      # Proves the guards fire rather than merely exist: per-tenant visibility,
      # fail-closed with no tenant context, IDOR by explicit UUID, the privileged-role
      # escape hatch, append-only enforcement, and tenant erasure.
      - name: Verify tenant isolation end to end
        run: ./docs/verification/run.sh
        env:
          PORT: 55432

      - run: npm run test:coverage

      - run: npm run build

  audit:
    runs-on: ubuntu-latest
    # Advisories land on their own schedule, not ours. A new critical in a transitive
    # dependency should fail the build on the next push even when nothing changed.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@12
      - run: npm ci

      # High and critical fail. Moderate and low are reported and do not block: this is
      # a self-hosted server-side app with no untrusted client bundle, and a blocking
      # gate on every moderate prototype-pollution advisory in a build tool trains people
      # to add ignore entries, which is worse than the advisory.
      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Report moderate and low advisories
        if: always()
        run: npm audit --audit-level=low || true
