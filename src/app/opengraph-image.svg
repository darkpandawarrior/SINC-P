<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="SINC-P — student grievance redressal">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0e7490"/><stop offset="55%" stop-color="#4338ca"/><stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1010" cy="140" r="190" fill="#4338ca" opacity="0.07"/>
  <circle cx="180" cy="540" r="160" fill="#0e7490" opacity="0.07"/>

  <text x="80" y="150" font-family="Segoe UI, system-ui, sans-serif" font-size="26" font-weight="600" fill="#64748b" letter-spacing="4">SINC-P</text>
  <text x="80" y="270" font-family="Segoe UI, system-ui, sans-serif" font-size="76" font-weight="800" fill="#0f172a">Your complaint gets a</text>
  <text x="80" y="360" font-family="Segoe UI, system-ui, sans-serif" font-size="76" font-weight="800" fill="url(#ink)">deadline, not a shrug.</text>
  <text x="80" y="440" font-family="Segoe UI, system-ui, sans-serif" font-size="27" fill="#475569">Statutory grievance redressal for Indian higher education.</text>
  <text x="80" y="482" font-family="Segoe UI, system-ui, sans-serif" font-size="27" fill="#475569">UGC 2023 clocks, an Ombudsperson tier, a tamper-evident record.</text>

  <g transform="translate(80,530)" font-family="Segoe UI, system-ui, sans-serif" font-size="20" fill="#64748b">
    <text x="0" y="20">Next.js 16</text>
    <text x="140" y="20">·</text>
    <text x="165" y="20">Postgres RLS</text>
    <text x="330" y="20">·</text>
    <text x="355" y="20">hash-chained audit trail</text>
    <text x="640" y="20">·</text>
    <text x="665" y="20">AGPL-3.0</text>
  </g>
</svg>
