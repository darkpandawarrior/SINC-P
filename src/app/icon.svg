<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="SINC-P">
  <!-- The mark is the thing the product is: a clock with one link of a chain through it.
       A deadline, and a record nobody can quietly edit. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e7490"/>
      <stop offset="60%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#g)"/>
  <circle cx="32" cy="32" r="17" fill="none" stroke="#fff" stroke-width="4" stroke-opacity="0.35"/>
  <!-- Hand at roughly 15 days into a window, i.e. time nearly gone. -->
  <path d="M32 32 V19" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M32 32 L42 38" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/>
  <circle cx="32" cy="32" r="3" fill="#fff"/>
</svg>
